兜底 = fallback,香港,台湾,新加坡,韩国,日本,美国,其他,DIRECT,policy-select-name=香港,interval=300,timeout=5,url=http://www.gstatic.com/generate_204
香港 = url-test,url=http://www.gstatic.com/generate_204,select=0,policy-regex-filter=(?i)^(?=.*(🇭🇰|HK|HKG|Hong|香港|深港|沪港|京港|港))(?!.*(回国|校园|游戏|🎮|GAME)).*$,policy-select-name=🇭🇰 香港 02,timeout=5,tolerance=50,interval=600
台湾 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=(?i)^(?=.*(🇹🇼|TW|TWN|Taiwan|Taipei|台湾|台灣|台北|台中|新北|彰化))(?!.*(回国|校园|游戏|🎮|GAME)).*$
新加坡 = url-test,url=http://www.gstatic.com/generate_204,select=0,policy-regex-filter=(?i)^(?=.*(🇸🇬|SG|SGP|Sing|Singapore|新加坡|狮城))(?!.*(回国|校园|游戏|🎮|GAME)).*$,policy-select-name=🇸🇬 新加坡 02,timeout=5,tolerance=50,interval=600
韩国 = url-test,url=http://www.gstatic.com/generate_204,select=0,policy-regex-filter=(?i)^(?=.*(🇰🇷|KR|KOR|Korea|韩国|首尔|韩|韓|春川))(?!.*(回国|校园|游戏|🎮|GAME)).*$,policy-select-name=🇰🇷 韩国 01,timeout=5,tolerance=50,interval=600
日本 = url-test,url=http://www.gstatic.com/generate_204,select=0,policy-regex-filter=(?i)^(?=.*(🇯🇵|JP|JPN|Japan|Tokyo|日本|日|东京|大阪|埼玉|川日|泉日))(?!.*(回国|校园|游戏|🎮|GAME)).*$,policy-select-name=🇭🇰 套餐重置日期：2026-09-25,timeout=5,tolerance=50,interval=600
美国 = url-test,url=http://www.gstatic.com/generate_204,select=0,policy-regex-filter=(?i)^(?=.*(🇺🇸|US|USA|America|United States|美国|洛杉矶|硅谷|波特兰|达拉斯|俄勒冈|圣何塞|凤凰城|西雅图|费利蒙|拉斯维加斯|圣克拉拉|芝加哥|纽约))(?!.*(回国|校园|游戏|🎮|GAME)).*$,policy-select-name=🇺🇲 美国 01,timeout=5,tolerance=50,interval=600
其他 = select,policy-select-name=🇵🇭 菲律宾 01,policy-regex-filter=(?i)^(?!.*(🇭🇰|HK|HKG|Hong|香港|深港|沪港|京港|港|🇹🇼|TW|TWN|Taiwan|Taipei|台湾|台灣|台北|台中|新北|彰化|🇯🇵|JP|JPN|Japan|Tokyo|日本|日|东京|大阪|埼玉|川日|泉日|🇰🇷|KR|KOR|Korea|韩国|首尔|韩|韓|春川|🇸🇬|SG|SGP|Sing|Singapore|新加坡|狮城|🇺🇸|US|USA|America|United States|美国|洛杉矶|硅谷|波特兰|达拉斯|俄勒冈|圣何塞|凤凰城|西雅图|费利蒙|拉斯维加斯|圣克拉拉|芝加哥|纽约|回国|校园|游戏|🎮|GAME|群|官网|网站|网址|订阅|流量|到期|剩余|已用|发布|工单|通知|备用|失联|版本)).*$

[Rule]
# PROXY：代理。通过代理服务器转发流量。
# DIRECT：直连。连接不经过任何代理服务器。
# TAILSCALE：Tailscale 出口。通过 Tailscale 隧道转发。
# REJECT：拒绝。返回HTTP状态码404，没有内容。
# 除此之外，规则策略还可以选择「代理分组」、「订阅名称」、「分组」、「节点」。

# 规则匹配的优先级：
# 1.模块规则优先于配置文件规则。
# 2.规则从上到下依次匹配。
# 3.域名规则优先于IP规则。

